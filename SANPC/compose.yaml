services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SANPC_HOST: 0.0.0.0
      SANPC_PORT: "8000"
      SANPC_DATA_DIR: /app/data
      SANPC_COOKIE_SECURE: "1"
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: